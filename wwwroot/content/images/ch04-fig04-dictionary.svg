<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.16"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker></defs><text x="540" y="36" font-size="19" fill="#212121" text-anchor="middle" font-weight="bold">Dictionary，用键直接找到值，不用逐个比较</text>
<text x="120" y="84" font-size="16" fill="#1976D2" text-anchor="middle" font-weight="bold">键（不能重复）</text>
