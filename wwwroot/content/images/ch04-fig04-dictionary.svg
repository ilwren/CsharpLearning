<rect x="40" y="200" width="160" height="62" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="120.0" y="237.0" font-size="18" fill="#212121" text-anchor="middle" font-weight="bold">"warn"</text>
<rect x="40" y="290" width="160" height="62" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="120.0" y="327.0" font-size="18" fill="#212121" text-anchor="middle" font-weight="bold">"error"</text>
<rect x="300" y="200" width="200" height="80" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#md1)"/><text x="400.0" y="245.33333333333334" font-size="16" fill="#212121" text-anchor="middle">计算哈希值，定位到格子</text>
<line x1="200" y1="141" x2="300" y2="225" stroke="#757575" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200" y1="231" x2="300" y2="240" stroke="#757575" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200" y1="321" x2="300" y2="260" stroke="#757575" stroke-width="2" marker-end="url(#arr)"/>
<text x="720" y="84" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">值（可以重复）</text>
<rect x="620" y="110" width="200" height="62" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="720.0" y="147.66666666666666" font-size="20" fill="#212121" text-anchor="middle" font-weight="bold">4</text>
<line x1="500" y1="240" x2="620" y2="141" stroke="#757575" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="620" y="200" width="200" height="62" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="720.0" y="237.66666666666666" font-size="20" fill="#212121" text-anchor="middle" font-weight="bold">2</text>
<line x1="500" y1="240" x2="620" y2="231" stroke="#757575" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="620" y="290" width="200" height="62" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="720.0" y="327.6666666666667" font-size="20" fill="#212121" text-anchor="middle" font-weight="bold">1</text>
<line x1="500" y1="240" x2="620" y2="321" stroke="#757575" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="540" y="470" font-size="16" fill="#212121" text-anchor="middle">d["warn"] 的查找过程，算出 "warn" 的位置，直接取出 2</text>
<text x="540" y="500" font-size="16" fill="#212121" text-anchor="middle">键不存在时，TryGetValue 返回 false，不会崩溃</text></svg>
