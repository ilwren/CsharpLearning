<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.16"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1976D2"/></marker></defs><rect x="30" y="80" width="280" height="300" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="170.0" y="189.9" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">联网机器（备货）</text><text x="170.0" y="212.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">SDK 压缩包或安装包</text><text x="170.0" y="235.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">IDE 安装包与 .vsix 扩展</text><text x="170.0" y="258.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">NuGet 包（所有 .nupkg）</text><text x="170.0" y="281.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">Avalonia 项目模板</text><line x1="322" y1="230" x2="426.0" y2="230.0" stroke="#1976D2" stroke-width="2"/><polygon points="438,230 426.0,224.0 426.0,236.0" fill="#1976D2"/><text x="380" y="212" font-size="14" fill="#1976D2" text-anchor="middle" font-weight="bold">U 盘或内网</text><rect x="440" y="80" width="220" height="300" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1" filter="url(#md1)"/><text x="550.0" y="189.9" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">介质</text><text x="550.0" y="212.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">只拷文件</text><text x="550.0" y="235.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">不需要网络</text><text x="550.0" y="258.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">目录结构原样保留</text><text x="550.0" y="281.9" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">核对 SHA-512 校验值</text><line x1="672" y1="230" x2="726.0" y2="230.0" stroke="#1976D2" stroke-width="2"/><polygon points="738,230 726.0,224.0 726.0,236.0" fill="#1976D2"/><rect x="740" y="80" width="330" height="300" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="905.0" y="178.4" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">离线机器（安装）</text><text x="905.0" y="201.4" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">1. 解压 SDK 到固定目录</text><text x="905.0" y="224.4" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">2. 设置 DOTNET_ROOT 与 PATH</text><text x="905.0" y="247.4" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">3. dotnet --list-sdks 验证</text><text x="905.0" y="270.4" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">4. 本地 NuGet 源 dotnet restore</text><text x="905.0" y="293.4" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">5. dotnet build 通过即成功</text><text x="550" y="430" font-size="16" fill="#757575" text-anchor="middle" font-weight="normal">离线机器上不做任何在线下载，还原只读本地文件夹。</text></svg>