<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="421" viewBox="0 0 1100 421" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0B0B0"/></marker></defs><rect x="40" y="60" width="1020" height="60" rx="12" fill="#262626" stroke="#5F6368" stroke-width="1" filter="url(#md1)"/><text x="60" y="98" font-size="22" fill="#ECECEC" text-anchor="start" font-weight="normal" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace">Program.cs(1,24): error CS1002: 应输入 ; [demo.csproj]</text><circle cx="165" cy="46" r="12" fill="#90CAF9"/><text x="165" y="51" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">1</text><circle cx="331" cy="46" r="12" fill="#90CAF9"/><text x="331" y="51" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">2</text><circle cx="417" cy="46" r="12" fill="#90CAF9"/><text x="417" y="51" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">3</text><circle cx="528" cy="46" r="12" fill="#90CAF9"/><text x="528" y="51" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">4</text><circle cx="676" cy="46" r="12" fill="#90CAF9"/><text x="676" y="51" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">5</text><circle cx="62" cy="169" r="12" fill="#90CAF9"/><text x="62" y="174" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">1</text><text x="90" y="175" font-size="17" fill="#ECECEC" text-anchor="start" font-weight="bold">位置</text><text x="220" y="175" font-size="16" fill="#ECECEC" text-anchor="start" font-weight="normal">Program.cs 第 1 行第 24 列，编译器在这里发现问题</text><circle cx="62" cy="211" r="12" fill="#90CAF9"/><text x="62" y="216" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">2</text><text x="90" y="217" font-size="17" fill="#ECECEC" text-anchor="start" font-weight="bold">级别</text><text x="220" y="217" font-size="16" fill="#ECECEC" text-anchor="start" font-weight="normal">error 必须修改；warning 不会让编译失败，但最好也看一眼</text><circle cx="62" cy="253" r="12" fill="#90CAF9"/><text x="62" y="258" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">3</text><text x="90" y="259" font-size="17" fill="#ECECEC" text-anchor="start" font-weight="bold">错误码</text><text x="220" y="259" font-size="16" fill="#ECECEC" text-anchor="start" font-weight="normal">CS1002 是固定编号，拿它去搜索，能找到官方解释和示例</text><circle cx="62" cy="295" r="12" fill="#90CAF9"/><text x="62" y="300" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">4</text><text x="90" y="301" font-size="17" fill="#ECECEC" text-anchor="start" font-weight="bold">说明</text><text x="220" y="301" font-size="16" fill="#ECECEC" text-anchor="start" font-weight="normal">编译器想要的东西，这里是分号，它原本应该出现在这一行末尾</text><circle cx="62" cy="337" r="12" fill="#90CAF9"/><text x="62" y="342" font-size="15" fill="#1E1E1E" text-anchor="middle" font-weight="bold">5</text><text x="90" y="343" font-size="17" fill="#ECECEC" text-anchor="start" font-weight="bold">所属项目</text><text x="220" y="343" font-size="16" fill="#ECECEC" text-anchor="start" font-weight="normal">哪个 .csproj 报的错，多项目方案里靠它定位</text><text x="40" y="399" font-size="13" fill="#9E9E9E" text-anchor="start" font-weight="normal">示意图中的路径已缩短，你的终端会显示完整路径。</text></svg>
