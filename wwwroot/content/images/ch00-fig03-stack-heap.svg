<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.16"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1976D2"/></marker></defs><text x="250" y="50" font-size="20" fill="#1976D2" text-anchor="middle" font-weight="bold">栈（stack）</text><text x="250" y="74" font-size="14" fill="#757575" text-anchor="middle" font-weight="normal">函数调用时压入，返回时弹出</text><text x="780" y="50" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">堆（heap）</text><text x="780" y="74" font-size="14" fill="#757575" text-anchor="middle" font-weight="normal">new 出来的对象住在这里，由 GC 回收</text><rect x="60" y="100" width="380" height="300" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1" filter="url(#md1)"/><rect x="90" y="130" width="320" height="110" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="250" y="156" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">Main 的栈帧</text><text x="120" y="186" font-size="16" fill="#212121" text-anchor="start" font-weight="normal">count   3</text><text x="120" y="216" font-size="16" fill="#212121" text-anchor="start" font-weight="normal">log     引用</text><rect x="90" y="270" width="320" height="110" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="250" y="296" font-size="15" fill="#212121" text-anchor="middle" font-weight="bold">Parse 的栈帧（最后压入，在最上面）</text><text x="120" y="326" font-size="16" fill="#212121" text-anchor="start" font-weight="normal">line    引用</text><text x="120" y="356" font-size="16" fill="#212121" text-anchor="start" font-weight="normal">index   0</text><rect x="540" y="100" width="500" height="300" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1" filter="url(#md1)"/><rect x="580" y="130" width="420" height="100" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="790" y="156" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">List&lt;LogEntry&gt; 对象</text><text x="790" y="186" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">内部数组里有 3 个 LogEntry 的引用</text><text x="790" y="212" font-size="14" fill="#757575" text-anchor="middle" font-weight="normal">main 方法还在用它，所以暂时活着</text><rect x="580" y="260" width="420" height="100" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="790" y="286" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">string 对象</text><text x="790" y="316" font-size="15" fill="#212121" text-anchor="middle" font-weight="normal">"2026-11-01 ERROR 磁盘满了"</text><text x="790" y="342" font-size="14" fill="#757575" text-anchor="middle" font-weight="normal">被 Parse 的 line 引用，同样暂时活着</text><line x1="410" y1="216" x2="563.1" y2="191.9" stroke="#1976D2" stroke-width="2"/><polygon points="575,190 562.2,185.9 564.1,197.8" fill="#1976D2"/><line x1="410" y1="326" x2="563.1" y2="307.4" stroke="#1976D2" stroke-width="2"/><polygon points="575,306 562.4,301.5 563.8,313.4" fill="#1976D2"/><text x="490" y="196" font-size="14" fill="#1976D2" text-anchor="middle" font-weight="normal">引用</text><text x="490" y="320" font-size="14" fill="#1976D2" text-anchor="middle" font-weight="normal">引用</text></svg>