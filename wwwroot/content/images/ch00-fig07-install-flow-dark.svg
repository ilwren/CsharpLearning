<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0B0B0"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90CAF9"/></marker></defs><rect x="400" y="20" width="300" height="60" rx="12" fill="#262626" stroke="#9E9E9E" stroke-width="1" filter="url(#md1)"/><text x="550.0" y="44.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">开始</text><text x="550.0" y="66.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">想在这台机器上写 .NET 程序</text><line x1="550" y1="80" x2="550.0" y2="96.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="550,108 556.0,96.0 544.0,96.0" fill="#B0B0B0"/><polygon points="550,110 680,160 550,210 420,160" fill="#3D2A12" stroke="#FFB74D" stroke-width="2"/><text x="550" y="166" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">能联网吗</text><line x1="420" y1="160" x2="314.0" y2="160.0" stroke="#A5D6A7" stroke-width="2"/><polygon points="302,160 314.0,166.0 314.0,154.0" fill="#A5D6A7"/><text x="361" y="150" font-size="15" fill="#A5D6A7" text-anchor="middle" font-weight="bold">能</text><line x1="680" y1="160" x2="776.0" y2="160.0" stroke="#9E9E9E" stroke-width="2"/><polygon points="788,160 776.0,154.0 776.0,166.0" fill="#9E9E9E"/><text x="734" y="150" font-size="15" fill="#9E9E9E" text-anchor="middle" font-weight="bold">不能</text><rect x="40" y="130" width="262" height="240" rx="12" fill="#1D3A21" stroke="#A5D6A7" stroke-width="2" filter="url(#md1)"/><text x="171.0" y="213.2" font-size="15" fill="#ECECEC" text-anchor="middle" font-weight="bold">选一种安装方式</text><text x="171.0" y="234.2" font-size="13" fill="#ECECEC" text-anchor="middle" font-weight="normal">包管理器（winget、brew、apt）</text><text x="171.0" y="255.2" font-size="13" fill="#ECECEC" text-anchor="middle" font-weight="normal">官网安装包（.exe、.pkg）</text><text x="171.0" y="276.2" font-size="13" fill="#ECECEC" text-anchor="middle" font-weight="normal">安装脚本（dotnet-install）</text><text x="171.0" y="297.2" font-size="13" fill="#ECECEC" text-anchor="middle" font-weight="normal">压缩包（解压后设环境变量）</text><rect x="790" y="130" width="270" height="240" rx="12" fill="#262626" stroke="#9E9E9E" stroke-width="1" filter="url(#md1)"/><text x="925.0" y="211.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">离线部署</text><text x="925.0" y="233.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">1. 联网机器备好安装包</text><text x="925.0" y="255.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">2. 拷到目标机</text><text x="925.0" y="277.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">3. 解压或安装，再验证</text><text x="925.0" y="299.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">（见 0.20 节）</text><line x1="171" y1="370" x2="171.0" y2="406.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="171,418 177.0,406.0 165.0,406.0" fill="#B0B0B0"/><rect x="40" y="420" width="262" height="60" rx="12" fill="#17324D" stroke="#90CAF9" stroke-width="2" filter="url(#md1)"/><text x="171.0" y="444.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">dotnet --list-sdks</text><text x="171.0" y="466.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">能看到 10.0.x 即成功</text><line x1="302" y1="450" x2="400.0" y2="450.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="412,450 400.0,444.0 400.0,456.0" fill="#B0B0B0"/><polygon points="550,420 680,470 550,520 420,470" fill="#3D2A12" stroke="#FFB74D" stroke-width="2"/><text x="550" y="465" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">要图形化</text><text x="550" y="490" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">编辑器吗</text><line x1="680" y1="470" x2="746.0" y2="470.0" stroke="#9E9E9E" stroke-width="2"/><polygon points="758,470 746.0,464.0 746.0,476.0" fill="#9E9E9E"/><rect x="760" y="370" width="310" height="220" rx="12" fill="#17324D" stroke="#90CAF9" stroke-width="2" filter="url(#md1)"/><text x="915.0" y="452.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">编辑器选一个或几个</text><text x="915.0" y="474.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">VS Code 轻量，跨平台</text><text x="915.0" y="496.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">Visual Studio 在 Windows 上最全</text><text x="915.0" y="518.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">Rider 跨平台，非商业免费</text><line x1="550" y1="520" x2="550.0" y2="546.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="550,558 556.0,546.0 544.0,546.0" fill="#B0B0B0"/><rect x="400" y="560" width="300" height="50" rx="12" fill="#262626" stroke="#9E9E9E" stroke-width="1" filter="url(#md1)"/><text x="550.0" y="590.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">写代码，dotnet run 运行</text></svg>