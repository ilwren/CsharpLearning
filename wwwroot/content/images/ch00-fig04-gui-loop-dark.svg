<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0B0B0"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90CAF9"/></marker></defs><rect x="60" y="90" width="220" height="70" rx="12" fill="#262626" stroke="#9E9E9E" stroke-width="1" filter="url(#md1)"/><text x="170.0" y="119.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">鼠标 / 键盘</text><text x="170.0" y="141.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">硬件产生输入信号</text><rect x="340" y="90" width="220" height="70" rx="12" fill="#17324D" stroke="#90CAF9" stroke-width="2" filter="url(#md1)"/><text x="450.0" y="119.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">系统消息队列</text><text x="450.0" y="141.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">操作系统按顺序排队</text><rect x="620" y="90" width="220" height="70" rx="12" fill="#3D2A12" stroke="#FFB74D" stroke-width="2" filter="url(#md1)"/><text x="730.0" y="119.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">事件循环</text><text x="730.0" y="141.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">每次取出一条事件</text><rect x="620" y="250" width="220" height="70" rx="12" fill="#1D3A21" stroke="#A5D6A7" stroke-width="2" filter="url(#md1)"/><text x="730.0" y="279.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">派发给目标控件</text><text x="730.0" y="301.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">找到被点的按钮</text><rect x="340" y="250" width="220" height="70" rx="12" fill="#1D3A21" stroke="#A5D6A7" stroke-width="2" filter="url(#md1)"/><text x="450.0" y="279.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">控件处理事件</text><text x="450.0" y="301.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">修改属性，例如文字</text><rect x="60" y="250" width="220" height="70" rx="12" fill="#17324D" stroke="#90CAF9" stroke-width="2" filter="url(#md1)"/><text x="170.0" y="279.6" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="bold">请求重绘</text><text x="170.0" y="301.6" font-size="14" fill="#ECECEC" text-anchor="middle" font-weight="normal">布局后画到屏幕上</text><line x1="282" y1="125" x2="326.0" y2="125.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="338,125 326.0,119.0 326.0,131.0" fill="#B0B0B0"/><line x1="562" y1="125" x2="606.0" y2="125.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="618,125 606.0,119.0 606.0,131.0" fill="#B0B0B0"/><line x1="730" y1="162" x2="730.0" y2="236.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="730,248 736.0,236.0 724.0,236.0" fill="#B0B0B0"/><line x1="618" y1="285" x2="574.0" y2="285.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="562,285 574.0,291.0 574.0,279.0" fill="#B0B0B0"/><line x1="338" y1="285" x2="294.0" y2="285.0" stroke="#B0B0B0" stroke-width="2"/><polygon points="282,285 294.0,291.0 294.0,279.0" fill="#B0B0B0"/><text x="450" y="380" font-size="16" fill="#9E9E9E" text-anchor="middle" font-weight="normal">这一圈不停转。队列为空时循环会等待，不占 CPU。</text><text x="450" y="408" font-size="16" fill="#9E9E9E" text-anchor="middle" font-weight="normal">界面上所有操作都是这样一条一条处理的，包括拖动窗口和敲字。</text></svg>