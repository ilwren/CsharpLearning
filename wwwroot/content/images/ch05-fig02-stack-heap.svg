<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.16"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker></defs><rect x="30" y="20" width="400" height="480" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1" filter="url(#md1)"/><text x="54" y="56" font-size="20" fill="#1976D2" text-anchor="start" font-weight="bold">栈（stack）</text><text x="54" y="80" font-size="14" fill="#757575" text-anchor="start">Main 的栈帧，方法结束就整块弹出</text>
<rect x="60" y="140" width="340" height="70" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="230.0" y="180.66666666666666" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">count  4</text>
<text x="60" y="232" font-size="14" fill="#757575" text-anchor="start">int 是值类型，数据直接放在变量里</text>
<rect x="60" y="290" width="340" height="70" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="230.0" y="330.6666666666667" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">logs  →</text>
<text x="60" y="382" font-size="14" fill="#757575" text-anchor="start">引用类型，变量里只装着地址</text>
<rect x="480" y="20" width="610" height="480" rx="12" fill="#F5F5F5" stroke="#757575" stroke-width="1" filter="url(#md1)"/><text x="504" y="56" font-size="20" fill="#1976D2" text-anchor="start" font-weight="bold">堆（heap）</text><text x="504" y="80" font-size="14" fill="#757575" text-anchor="start">new 出来的对象住在这里，由 GC 回收</text>
<rect x="560" y="130" width="400" height="70" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="760.0" y="170.66666666666666" font-size="17" fill="#212121" text-anchor="middle" font-weight="bold">List&lt;LogEvent&gt;  Count = 1</text>
<line x1="760" y1="200" x2="760" y2="262" stroke="#616161" stroke-width="2" marker-end="url(#arr)"/>
<text x="772" y="236" font-size="14" fill="#757575" text-anchor="start">items[0]</text>
<rect x="560" y="262" width="400" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="580" y="292" font-size="17" fill="#2E7D32" text-anchor="start" font-weight="bold">LogEvent 对象</text>
<text x="580" y="330" font-size="15" fill="#212121" text-anchor="start">Ms       1520     int，值类型字段，直接放在对象里</text>
<text x="580" y="362" font-size="15" fill="#212121" text-anchor="start">Level    Error    枚举，值类型，也直接放在对象里</text>
<text x="580" y="394" font-size="15" fill="#212121" text-anchor="start">Module   →  字符串对象（引用类型）</text>
<line x1="330" y1="325" x2="560" y2="170" stroke="#616161" stroke-width="2" marker-end="url(#arr)"/></svg>
