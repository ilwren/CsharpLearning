<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.16"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1976D2"/></marker></defs><rect x="330" y="40" width="220" height="56" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="440.0" y="62.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">Window</text><text x="440.0" y="84.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">顶层窗口，只有一个</text><line x1="440" y1="96" x2="440" y2="130" stroke="#616161" stroke-width="2"/><rect x="330" y="130" width="220" height="56" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="440.0" y="152.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">DockPanel</text><text x="440.0" y="174.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">停靠容器，划分区域</text><line x1="440" y1="186" x2="440" y2="220" stroke="#616161" stroke-width="2"/><line x1="200" y1="220" x2="600" y2="220" stroke="#616161" stroke-width="2"/><line x1="200" y1="220" x2="200" y2="250" stroke="#616161" stroke-width="2"/><line x1="440" y1="220" x2="440" y2="250" stroke="#616161" stroke-width="2"/><line x1="600" y1="220" x2="600" y2="250" stroke="#616161" stroke-width="2"/><rect x="90" y="250" width="220" height="56" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="200.0" y="272.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">Menu</text><text x="200.0" y="294.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">菜单栏，停靠在顶部</text><rect x="330" y="250" width="220" height="56" rx="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#md1)"/><text x="440.0" y="272.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">Grid</text><text x="440.0" y="294.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">网格，按行列排</text><rect x="520" y="250" width="170" height="56" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="605.0" y="272.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">StatusBar</text><text x="605.0" y="294.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">底部状态栏</text><line x1="440" y1="306" x2="440" y2="340" stroke="#616161" stroke-width="2"/><line x1="260" y1="340" x2="600" y2="340" stroke="#616161" stroke-width="2"/><line x1="260" y1="340" x2="260" y2="368" stroke="#616161" stroke-width="2"/><line x1="440" y1="340" x2="440" y2="368" stroke="#616161" stroke-width="2"/><line x1="600" y1="340" x2="600" y2="368" stroke="#616161" stroke-width="2"/><rect x="150" y="368" width="220" height="56" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="260.0" y="390.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">TextBox</text><text x="260.0" y="412.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">输入框</text><rect x="340" y="368" width="200" height="56" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="440.0" y="390.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">Button</text><text x="440.0" y="412.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">按钮</text><rect x="540" y="368" width="220" height="56" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#md1)"/><text x="650.0" y="390.6" font-size="16" fill="#212121" text-anchor="middle" font-weight="bold">ListBox</text><text x="650.0" y="412.6" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">列表</text><rect x="830" y="40" width="250" height="380" rx="12" fill="#F5F5F5" stroke="#757575" filter="url(#md1)"/><text x="955" y="72" font-size="18" fill="#212121" text-anchor="middle" font-weight="bold">两趟遍历</text><text x="955" y="110" font-size="16" fill="#1976D2" text-anchor="middle" font-weight="bold">第一趟 测量</text><text x="955" y="136" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">从叶子往上问，你需要多大</text><text x="955" y="176" font-size="16" fill="#1976D2" text-anchor="middle" font-weight="bold">第二趟 排列</text><text x="955" y="202" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">从根往下分，你放在哪里</text><text x="955" y="242" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">然后绘制</text><text x="955" y="268" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">按树的顺序，从后到前画</text><text x="955" y="308" font-size="16" fill="#E65100" text-anchor="middle" font-weight="bold">数据变了就只重算</text><text x="955" y="334" font-size="14" fill="#212121" text-anchor="middle" font-weight="normal">受影响的那一小片</text><text x="955" y="372" font-size="14" fill="#757575" text-anchor="middle" font-weight="normal">这是保留模式的好处</text></svg>