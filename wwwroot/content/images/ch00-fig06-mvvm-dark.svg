<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="Roboto, Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"><defs><filter id="md1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/></filter></defs><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0B0B0"/></marker><marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90CAF9"/></marker></defs><rect x="40" y="130" width="260" height="150" rx="12" fill="#1D3A21" stroke="#A5D6A7" stroke-width="2" filter="url(#md1)"/><text x="170.0" y="187.3" font-size="18" fill="#ECECEC" text-anchor="middle" font-weight="bold">View（视图）</text><text x="170.0" y="211.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">XAML 写的界面</text><text x="170.0" y="235.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">按钮、文本框、列表</text><rect x="420" y="130" width="260" height="150" rx="12" fill="#17324D" stroke="#90CAF9" stroke-width="2" filter="url(#md1)"/><text x="550.0" y="187.3" font-size="18" fill="#ECECEC" text-anchor="middle" font-weight="bold">ViewModel（视图模型）</text><text x="550.0" y="211.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">界面需要的状态与命令</text><text x="550.0" y="235.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">不认识具体控件</text><rect x="800" y="130" width="260" height="150" rx="12" fill="#3D2A12" stroke="#FFB74D" stroke-width="2" filter="url(#md1)"/><text x="930.0" y="187.3" font-size="18" fill="#ECECEC" text-anchor="middle" font-weight="bold">Model（模型）</text><text x="930.0" y="211.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">日志条目、分析引擎</text><text x="930.0" y="235.3" font-size="16" fill="#ECECEC" text-anchor="middle" font-weight="normal">不认识界面</text><line x1="302" y1="180" x2="406.0" y2="180.0" stroke="#90CAF9" stroke-width="2"/><polygon points="418,180 406.0,174.0 406.0,186.0" fill="#90CAF9"/><text x="360" y="166" font-size="14" fill="#90CAF9" text-anchor="middle" font-weight="normal">绑定 Binding</text><line x1="418" y1="230" x2="314.0" y2="230.0" stroke="#A5D6A7" stroke-width="2"/><polygon points="302,230 314.0,236.0 314.0,224.0" fill="#A5D6A7"/><text x="360" y="262" font-size="14" fill="#A5D6A7" text-anchor="middle" font-weight="normal">属性变了就通知</text><line x1="682" y1="180" x2="786.0" y2="180.0" stroke="#90CAF9" stroke-width="2"/><polygon points="798,180 786.0,174.0 786.0,186.0" fill="#90CAF9"/><text x="740" y="166" font-size="14" fill="#90CAF9" text-anchor="middle" font-weight="normal">调用方法</text><line x1="798" y1="230" x2="694.0" y2="230.0" stroke="#FFB74D" stroke-width="2"/><polygon points="682,230 694.0,236.0 694.0,224.0" fill="#FFB74D"/><text x="740" y="262" font-size="14" fill="#FFB74D" text-anchor="middle" font-weight="normal">返回结果</text><text x="550" y="360" font-size="15" fill="#9E9E9E" text-anchor="middle" font-weight="normal">箭头方向表示数据或操作的流向。</text><text x="550" y="388" font-size="15" fill="#9E9E9E" text-anchor="middle" font-weight="normal">ViewModel 不引用任何控件，所以能脱离窗口单独测试。</text></svg>